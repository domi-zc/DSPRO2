services:
  fast-api-app:
    build: .
    restart: always

  caddy:
    image: caddy:latest
    restart: always
    ports:
      - "80:80" # HTTP
      - "443:443" # HTTPS
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - fast-api-app

volumes:
  caddy_data:
  caddy_config: